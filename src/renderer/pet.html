<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' blob:; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>小球同桌 · 桌面小球</title>
  <link rel="stylesheet" href="pet.css">
  <link rel="stylesheet" href="buddy-motion.css">
  <link rel="stylesheet" href="appearance.css">
</head>
<body>
  <main class="pet">
    <div class="pet-speech" id="pet-speech" aria-live="polite"><span class="pet-speech-text" id="pet-speech-text">写下一件想做的事吧。</span></div>
    <button type="button" class="pet-ball-button" id="pet-ball-button" aria-label="摸摸小球，双击旋转，按住拖动"><span id="pet-ball" data-testid="pet-ball" class="pet-ball" aria-hidden="true"></span></button>
    <div class="pet-controls"><div class="pet-drag" aria-label="小球拖动区"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7h10M5 12h10"/></svg></div><span class="pet-timer" id="pet-timer" hidden></span><button type="button" id="pet-open-panel" data-testid="pet-open-panel" aria-label="打开任务面板"><span>去书桌</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12m-5-5 5 5-5 5"/></svg></button></div>
  </main>
  <script src="../../vendor/emotion-ball/rings.js"></script>
  <script src="../../vendor/emotion-ball/emotions.js"></script>
  <script src="../../vendor/emotion-ball/ball.js"></script>
  <script src="../../vendor/emotion-ball/engine.js"></script>
  <script src="companion.js"></script>
  <script src="interactions.js"></script>
  <script src="appearance.js"></script>
  <script src="pet.js"></script>
</body>
</html>
